name: Bench native private
# benchmark revision: native-map-set

on:
  push:
    branches: [bench-native-private]
  pull_request:
    branches: [hol-light-scratch]
  workflow_dispatch:

jobs:
  bench:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'bench-native-private'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hol-light-scratch
          path: baseline
      - uses: actions/checkout@v4
        with:
          ref: bench-native-private
          path: experiment
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: 9.3
          variant: CS
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ocaml-nox libnum-ocaml-dev
          raco pkg install --auto --batch --no-docs --no-setup --skip-installed \
            --name rhombus-hol-bench "$GITHUB_WORKSPACE/baseline"
      - name: Compile experiment once
        run: raco make experiment/rhombus/hol/simp.rhm
      - name: Cold compile benchmark
        shell: bash
        run: |
          set -euo pipefail
          clean() { find "$1" -type d -name compiled -prune -exec rm -rf {} +; }
          : > compile-times.txt
          for round in 1 2 3; do
            clean baseline
            /usr/bin/time -f "baseline,$round,%e,%M" -o baseline.time \
              raco make baseline/rhombus/hol/simp.rhm
            cat baseline.time | tee -a compile-times.txt
            clean experiment
            /usr/bin/time -f "experiment,$round,%e,%M" -o experiment.time \
              raco make experiment/rhombus/hol/simp.rhm
            cat experiment.time | tee -a compile-times.txt
          done
          echo "=== compile times: variant,round,seconds,maxrss_kb ==="
          cat compile-times.txt
      - name: Differential runtime benchmark
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE/baseline"
          /usr/bin/time -f "baseline-kernel,%e,%M" -o ../baseline-kernel.time \
            python3 differential/tests/run.py
          bkl=$?
          /usr/bin/time -f "baseline-upper,%e,%M" -o ../baseline-upper.time \
            python3 differential/tests/run_upper.py
          bul=$?
          cd "$GITHUB_WORKSPACE/experiment"
          /usr/bin/time -f "experiment-kernel,%e,%M" -o ../experiment-kernel.time \
            python3 differential/tests/run.py
          ekl=$?
          /usr/bin/time -f "experiment-upper,%e,%M" -o ../experiment-upper.time \
            python3 differential/tests/run_upper.py
          eul=$?
          cd "$GITHUB_WORKSPACE"
          echo "=== differential times: suite,seconds,maxrss_kb ==="
          cat baseline-kernel.time baseline-upper.time experiment-kernel.time experiment-upper.time
          echo "exit-status baseline-kernel=$bkl baseline-upper=$bul experiment-kernel=$ekl experiment-upper=$eul"
          echo "=== experimental summaries ==="
          cat experiment/differential/results/summary.json || true
          cat experiment/differential/results/upper-summary.json || true
          exit 0
