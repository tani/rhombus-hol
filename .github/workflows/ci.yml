name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: 9.3
          variant: CS
      - name: Install
        run: raco pkg install --auto --batch --no-docs --skip-installed --name rhombus-hol "$PWD"
      - name: Compile
        run: raco make rhombus/hol/tactics.rhm
      - name: Test
        run: raco test rhombus/hol/tests
