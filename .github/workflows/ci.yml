name: CI

# The three commands used as completion checks:
#
#   raco make rhombus-hol-lib/rhombus/hol.rkt   the library compiles
#   raco test rhombus-hol/rhombus/hol/tests     the suite passes
#   raco setup --pkgs rhombus-hol               the documentation builds
#

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A second push to a branch makes the first run's answer stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Check distributable license notices
        run: |
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES
          test -s LICENSES/HOL-Light.txt
          test -s LICENSES/HOL4.txt
          test -s LICENSES/ACL2.txt
          test -s LICENSES/QuickCheck.txt
          test -s LICENSES/Racket-Scribble.txt
          test -s LICENSES/Embedded-Fonts.txt
          test -s LICENSES/Isabelle.txt
          for package in \
            rhombus-hol-kernel rhombus-hol-lib rhombus-hol \
            isabelle-hol-kernel; do
            cmp LICENSE "$package/LICENSE"
            test -s "$package/THIRD_PARTY_NOTICES"
          done
          cmp LICENSES/HOL-Light.txt rhombus-hol-kernel/LICENSES/HOL-Light.txt
          cmp LICENSES/HOL-Light.txt rhombus-hol-lib/LICENSES/HOL-Light.txt
          cmp LICENSES/HOL-Light.txt isabelle-hol-kernel/LICENSES/HOL-Light.txt
          cmp LICENSES/HOL4.txt rhombus-hol-lib/LICENSES/HOL4.txt
          cmp LICENSES/HOL4.txt isabelle-hol-kernel/LICENSES/HOL4.txt
          cmp LICENSES/ACL2.txt rhombus-hol-lib/LICENSES/ACL2.txt
          cmp LICENSES/QuickCheck.txt rhombus-hol-lib/LICENSES/QuickCheck.txt
          cmp LICENSES/Racket-Scribble.txt rhombus-hol/LICENSES/Racket-Scribble.txt
          cmp LICENSES/Embedded-Fonts.txt rhombus-hol/LICENSES/Embedded-Fonts.txt
          cmp LICENSES/Isabelle.txt isabelle-hol-kernel/LICENSES/Isabelle.txt

      # Package caches contain Racket-compiled artifacts. `current` changes
      # independently of this repository, invalidating that cache frequently;
      # use the released Racket version tested by the Nix development shell.
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: 9.3
          variant: CS

      # Rotate weekly as well as on Racket or dependency changes, so the cache
      # cannot hide catalog updates indefinitely.
      - name: Record the Racket cache inputs
        run: |
          racket --version > .racket-version
          date -u +%G-%V > .racket-cache-week

      - name: Cache Racket packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/racket
            ~/.local/share/racket
          key: ${{ runner.os }}-${{ runner.arch }}-racket-packages-${{ hashFiles('.racket-version', '.racket-cache-week', 'rhombus-hol-kernel/info.rkt', 'rhombus-hol-lib/info.rkt', 'rhombus-hol-stdlib/info.rkt', 'rhombus-hol/info.rkt') }}

      # One install for all three, so the dependencies among them resolve as
      # links to this checkout rather than as catalog lookups. `--auto` pulls
      # in `rhombus-lib`; `--no-docs` leaves the documentation to the step
      # that exists to check it. A restored cache already contains these
      # package registrations, so `--skip-installed` makes the hit path cheap.
      - name: Install the packages
        run: |
          raco pkg install --auto --batch --no-docs --skip-installed \
            rhombus-hol-kernel/ rhombus-hol-lib/ rhombus-hol-stdlib/ rhombus-hol/

      - name: Compile the libraries
        run: |
          raco make rhombus-hol-lib/rhombus/hol.rkt
          raco make rhombus-hol-stdlib/rhombus/hol/stdlib.rhm

      - name: Run the test suite in parallel
        run: raco test --jobs "$(nproc)" rhombus-hol/rhombus/hol/tests

      # `raco setup` reports a document it could not build and still exits 0,
      # so the log is what has to be read. Fixtures that are *meant* not to
      # compile are kept out of setup by `tests/fixtures/info.rkt`, so
      # anything reported here is real.
      - name: Build the documentation
        run: |
          set -o pipefail
          raco setup --pkgs rhombus-hol 2>&1 | tee setup.log
          if grep -q '^raco setup: error' setup.log; then
            echo "::error::raco setup reported errors"
            grep -A 3 '^raco setup: error' setup.log
            exit 1
          fi

  formal-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30

      - name: Record the formal-kernel Racket cache inputs
        run: |
          nix develop --command racket --version > .formal-racket-version
          date -u +%G-%V > .racket-cache-week

      - name: Cache formal-kernel Racket packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/racket
            ~/.local/share/racket
          key: ${{ runner.os }}-${{ runner.arch }}-formal-racket-packages-${{ hashFiles('.formal-racket-version', '.racket-cache-week', 'flake.lock', 'rhombus-hol-kernel/info.rkt') }}

      - name: Install Rhombus compiler and kernel ABI
        run: >-
          nix develop --command raco pkg install --auto --batch --no-docs
          --skip-installed rhombus-lib rhombus-hol-kernel/

      - name: Check formal kernel and generated artifact
        run: ./isabelle-hol-kernel/export-kernel.sh --check

      - name: Compile generated Rhombus kernel
        run: |
          nix develop --command raco make \
            rhombus-hol-kernel/rhombus/hol/kernel_generated.rhm

      - name: Run generated Rhombus kernel smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/rhombus-hol-export"
          cp rhombus-hol-kernel/rhombus/hol/kernel_generated.rhm \
            "$RUNNER_TEMP/rhombus-hol-export/rhombus_hol_kernel.rhm"
          cp isabelle-hol-kernel/Rhombus_HOL_Code_Smoke.rhm \
            "$RUNNER_TEMP/rhombus-hol-export/"
          nix develop --command raco test \
            "$RUNNER_TEMP/rhombus-hol-export/Rhombus_HOL_Code_Smoke.rhm"

      - name: Reject unfinished proof commands
        run: |
          if grep -R -n -E '\b(sorry|oops|axiomatization|oracle)\b' isabelle-hol-kernel \
              --include='*.thy' --include='*.ML'; then
            echo "::error::unfinished or additional trusted proof command found"
            exit 1
          fi
