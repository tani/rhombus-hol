name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: 9.3
          variant: CS
      - name: Install
        run: raco pkg install --auto --batch --no-docs --no-setup --skip-installed --name rhombus-hol "$PWD"
      - name: Compile
        run: raco make rhombus/hol/tests/fast.rhm rhombus/hol/tests/{fusion,kernel,statement,reference,declarations,bool,engine,hol_quote,inference_errors,proof_syntax}.rhm
      - name: Test
        run: raco test rhombus/hol/tests/fast.rhm

  theories:
    # Replays standard theories once, then runs all contracts and examples.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: 9.3
          variant: CS
      - name: Install
        run: raco pkg install --auto --batch --no-docs --no-setup --skip-installed --name rhombus-hol "$PWD"
      - name: Compile
        run: raco make -j 4 rhombus/hol/define.rhm rhombus/hol/tests/all.rhm rhombus/hol/tests/axioms.rhm rhombus/hol/tests/upstream/*.rhm
      - name: Test
        run: raco test rhombus/hol/tests/all.rhm
