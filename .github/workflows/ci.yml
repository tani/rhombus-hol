name: CI

# The three commands `PLAN.md` treats as the completion condition:
#
#   raco make rhombus-hol-lib/rhombus/hol.rkt   the library compiles
#   raco test rhombus-hol/rhombus/hol/tests     the suite passes
#   raco setup --pkgs rhombus-hol               the documentation builds
#

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A second push to a branch makes the first run's answer stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Check distributable license notices
        run: |
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES
          test -s LICENSES/HOL-Light.txt
          test -s LICENSES/HOL4.txt
          test -s LICENSES/ACL2.txt
          test -s LICENSES/QuickCheck.txt
          test -s LICENSES/Racket-Scribble.txt
          test -s LICENSES/Embedded-Fonts.txt
          test -s LICENSES/Isabelle.txt
          test -s rhombus-hol-kernel/LICENSE
          test -s rhombus-hol-kernel/THIRD_PARTY_NOTICES
          test -s rhombus-hol-kernel/LICENSES/HOL-Light.txt
          test -s rhombus-hol-lib/LICENSE
          test -s rhombus-hol-lib/THIRD_PARTY_NOTICES
          test -s rhombus-hol-lib/LICENSES/HOL-Light.txt
          test -s rhombus-hol-lib/LICENSES/HOL4.txt
          test -s rhombus-hol-lib/LICENSES/ACL2.txt
          test -s rhombus-hol-lib/LICENSES/QuickCheck.txt
          test -s rhombus-hol/LICENSE
          test -s rhombus-hol/THIRD_PARTY_NOTICES
          test -s rhombus-hol/LICENSES/Racket-Scribble.txt
          test -s rhombus-hol/LICENSES/Embedded-Fonts.txt
          test -s isabelle-hol-kernel/LICENSE
          test -s isabelle-hol-kernel/THIRD_PARTY_NOTICES
          test -s isabelle-hol-kernel/LICENSES/Isabelle.txt
          test -s isabelle-hol-kernel/LICENSES/HOL-Light.txt
          test -s isabelle-hol-kernel/LICENSES/HOL4.txt

      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: current
          variant: CS

      # One install for all three, so the dependencies among them resolve as
      # links to this checkout rather than as catalog lookups. `--auto` pulls
      # in `rhombus-lib`; `--no-docs` leaves the documentation to the step
      # that exists to check it.
      - name: Install the packages
        run: |
          raco pkg install --auto --batch --no-docs \
            rhombus-hol-kernel/ rhombus-hol-lib/ rhombus-hol/

      - name: Compile the library
        run: raco make rhombus-hol-lib/rhombus/hol.rkt

      - name: Run the test suite
        run: raco test rhombus-hol/rhombus/hol/tests

      # `raco setup` reports a document it could not build and still exits 0,
      # so the log is what has to be read. Fixtures that are *meant* not to
      # compile are kept out of setup by `tests/fixtures/info.rkt`, so
      # anything reported here is real.
      - name: Build the documentation
        run: |
          set -o pipefail
          raco setup --pkgs rhombus-hol 2>&1 | tee setup.log
          if grep -q '^raco setup: error' setup.log; then
            echo "::error::raco setup reported errors"
            grep -A 3 '^raco setup: error' setup.log
            exit 1
          fi

  formal-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v30

      - name: Build Isabelle/HOL kernel session
        run: nix develop --command isabelle build -D isabelle-hol-kernel -o quick_and_dirty=false -v Rhombus_HOL_Kernel

      - name: Reject unfinished proof commands
        run: |
          if grep -R -n -E '\b(sorry|oops|axiomatization|oracle)\b' isabelle-hol-kernel \
              --include='*.thy' --include='*.ML'; then
            echo "::error::unfinished or additional trusted proof command found"
            exit 1
          fi
