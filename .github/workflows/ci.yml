name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: 9.3
          variant: CS
      - name: Install
        run: raco pkg install --auto --batch --no-docs --no-setup --skip-installed --name rhombus-hol "$PWD"
      - name: Cache compiled modules
        uses: actions/cache@v4
        with:
          path: |
            rhombus/**/compiled
          key: compiled-racket-9.3-test-${{ hashFiles('rhombus/**/*.rhm', 'info.rkt') }}
          restore-keys: compiled-racket-9.3-test-
      - name: Compile
        # every module the unit tests import, so that nothing is compiled
        # in memory while testing (hol_quote.rhm imports lists.rhm)
        run: raco make -j 4 rhombus/hol/tests/*.rhm
      - name: Test
        run: raco test rhombus/hol/tests/*.rhm

  theories:
    # Replays every standard theory and compares against pinned HOL Light.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: 9.3
          variant: CS
      - name: Install
        run: raco pkg install --auto --batch --no-docs --no-setup --skip-installed --name rhombus-hol "$PWD"
      - name: Cache compiled modules
        uses: actions/cache@v4
        with:
          path: |
            rhombus/**/compiled
          key: compiled-racket-9.3-theories-${{ hashFiles('rhombus/**/*.rhm', 'info.rkt') }}
          restore-keys: compiled-racket-9.3-theories-
      - name: Compile
        run: raco make -j 4 rhombus/hol/define.rhm rhombus/hol/tests/slow/theories.rhm rhombus/hol/tests/upstream/lagrange_lemma.rhm
      - name: Test
        # theories.rhm replays the standard theories once for the golden and
        # upstream suites; lagrange_lemma.rhm needs a process of its own
        run: raco test -j 2 rhombus/hol/tests/slow/theories.rhm rhombus/hol/tests/upstream/lagrange_lemma.rhm

  literalness:
    # Reports how closely each module follows the pinned HOL Light source and
    # fails when a logic-layer module drops below tools/literalness/baseline.json.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned HOL Light
        run: |
          git init -q hol-light
          git -C hol-light fetch -q --depth 1 https://github.com/jrh13/hol-light.git cba9198db76e9dfb89cbd653df9412d01f65b22a
          git -C hol-light checkout -q FETCH_HEAD
      - name: Measure
        run: python3 tools/literalness/measure.py hol-light --check

  ml2rhm:
    # Translates all of pinned HOL Light with tools/ml2rhm, compares the
    # result with the port, and compiles the generated modules that are
    # known to work in place of the hand-maintained ones.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: 9.3
          variant: CS
      - name: Install
        run: raco pkg install --auto --batch --no-docs --no-setup --skip-installed --name rhombus-hol "$PWD"
      - name: Cache compiled modules
        uses: actions/cache@v4
        with:
          path: |
            rhombus/**/compiled
          key: compiled-racket-9.3-ml2rhm-${{ hashFiles('rhombus/**/*.rhm', 'info.rkt') }}
          restore-keys: compiled-racket-9.3-ml2rhm-
      - name: Fetch pinned HOL Light
        run: |
          git init -q hol-light
          git -C hol-light fetch -q --depth 1 https://github.com/jrh13/hol-light.git cba9198db76e9dfb89cbd653df9412d01f65b22a
          git -C hol-light checkout -q FETCH_HEAD
      - name: Parse
        run: racket tools/ml2rhm/coverage.rkt hol-light 569
      - name: Translate
        run: racket tools/ml2rhm/main.rkt --out ml2rhm-out hol-light
      - name: Compare with the port
        run: python3 tools/ml2rhm/compare.py hol-light ml2rhm-out
      - name: Compile in place of the port
        run: |
          raco make -j 4 rhombus/hol/define.rhm
          tools/ml2rhm/dropin.sh ml2rhm-out lib fusion basics nets printer preterm parser equal \
            bool drule tactics itab simp theorems ind_defs class trivia canon meson firstorder \
            metis thecops quot impconv pair compute nums recursion arith wf calc_num normalizer \
            grobner ind_types lists realax calc_int realarith real calc_rat int sets iterate \
            cart define
