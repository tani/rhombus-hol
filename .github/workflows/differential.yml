name: Differential

on:
  workflow_dispatch:

jobs:
  differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: 9.3
          variant: CS

      - name: Install OCaml oracle dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ocaml-nox libnum-ocaml-dev

      - name: Install Rhombus/HOL
        run: |
          raco pkg install --auto --batch --no-docs --skip-installed \
            --name rhombus-hol "$PWD"

      - name: Kernel differential suite
        run: python3 differential/tests/run.py

      - name: Basics nets equal differential suite
        run: python3 differential/tests/run_upper.py
