name: Documentation

# The installed packages are compiled without rendering their locally installed
# manuals. A separate `raco scribble` invocation renders the public manual with
# version-pinned HTTPS cross-reference redirects, so runner-local `file://`
# scripts and paths cannot leak into the Pages artifact.
#
# CI builds the documentation on every branch; this workflow publishes the
# public manual and checked Isabelle theory presentation produced from main.

on:
  push:
    branches: [main]
  workflow_dispatch:

# What the deploy job needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and no cancelling: a half-finished deploy is worse
# than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned rather than `current`: Racket bytecode is version-specific, so a
  # moving version would invalidate both caches below on every run. 9.3 is
  # what the packages are developed against.
  RACKET_VERSION: '9.3'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30

      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: ${{ env.RACKET_VERSION }}
          variant: CS

      # `rhombus-lib` and `rhombus-scribble-lib` are the only things `--auto`
      # can reach for, and building them from the catalog dominates a cold
      # run. Whether an installer already ships them differs between the
      # Racket and Rhombus distributions, so rather than assume: cache the
      # package tree, and the catalog build happens at most once.
      - name: Cache the installed packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/racket
            ~/.cache/racket
          key: racket-pkgs-${{ env.RACKET_VERSION }}-${{ hashFiles('*/info.rkt') }}
          restore-keys: racket-pkgs-${{ env.RACKET_VERSION }}-

      # The three packages install as links to this checkout, so `raco setup`
      # writes their bytecode into compiled/ directories here. Reusing those
      # is safe: a .dep file records the Racket version and the source hash,
      # so raco recompiles whatever moved and the pin above keeps the rest
      # valid.
      - name: Cache the compiled bytecode
        uses: actions/cache@v4
        with:
          path: |
            rhombus-hol-kernel/**/compiled
            rhombus-hol-prover/**/compiled
            rhombus-hol-stdlib/**/compiled
            rhombus-hol/**/compiled
          key: racket-zo-${{ env.RACKET_VERSION }}-${{ hashFiles('**/*.rhm', '**/*.rkt', '**/*.scrbl') }}
          restore-keys: racket-zo-${{ env.RACKET_VERSION }}-

      # One install for all four, so the dependencies among them resolve as
      # links to this checkout rather than as catalog lookups. `--no-setup`
      # leaves every compile to the single parallel `raco setup` below instead
      # of compiling once here and again there; `--skip-installed` is what
      # makes the run idempotent when the cache above restored the links.
      - name: Link the packages
        run: |
          raco pkg install --auto --batch --no-setup --skip-installed \
            rhombus-hol-kernel/ rhombus-hol-prover/ rhombus-hol-stdlib/ rhombus-hol/

      # Compile package code without rendering the locally installed manual.
      # That form of the manual contains local documentation redirect scripts
      # whose file:// URLs are correct only on the build machine.
      - name: Compile the documentation dependencies
        run: |
          set -o pipefail
          raco setup --jobs "$(nproc)" --no-docs \
            --pkgs rhombus-hol-kernel rhombus-hol-prover rhombus-hol-stdlib rhombus-hol 2>&1 | tee setup.log
          if grep -q '^raco setup: error' setup.log; then
            echo "::error::raco setup reported errors"
            grep -A 3 '^raco setup: error' setup.log
            exit 1
          fi

      # Render a self-contained public tree. `+m` supplies installed
      # cross-references; the two redirects turn references outside this
      # package into stable Racket 9.3 HTTPS links instead of local files.
      - name: Build the public manuals
        run: |
          raco scribble --htmls --dest _site --make \
            --redirect-main https://download.racket-lang.org/releases/9.3/doc/ \
            --redirect https://download.racket-lang.org/releases/9.3/doc/local-redirect/index.html \
            +m --lib rhombus/hol/scribblings/rhombus-hol.scrbl
          raco scribble --markdown --dest _site --dest-name llms-full.md --make \
            --redirect-main https://download.racket-lang.org/releases/9.3/doc/ \
            --redirect https://download.racket-lang.org/releases/9.3/doc/local-redirect/index.html \
            +m --lib rhombus/hol/scribblings/rhombus-hol.scrbl
          test -s _site/llms-full.md
          grep -q '^# Rhombus/HOL$' _site/llms-full.md
          grep -q '^## 7\. License and Third-Party Notices$' _site/llms-full.md
          if grep -R -n 'file://' _site/rhombus-hol --include='*.html' \
              || grep -n 'file://' _site/llms-full.md; then
            echo "::error::public documentation contains a local file URL"
            exit 1
          fi

      - name: Assemble the site and license notices
        run: |
          site=_site
          mkdir -p "$site/licenses"
          cp LICENSE THIRD_PARTY_NOTICES "$site/licenses/"
          cp LICENSES/* "$site/licenses/"
          cat > "$site/index.html" <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Rhombus/HOL</title>
          <link rel="alternate" type="text/markdown" href="llms-full.md">
          <h1>Rhombus/HOL</h1>
          <ul>
            <li><a href="rhombus-hol/index.html">Language and prover manual</a></li>
            <li><a href="llms-full.md">Complete manual as Markdown</a></li>
            <li><a href="isabelle/Unsorted/Rhombus_HOL_Kernel/index.html">Isabelle/HOL kernel verification</a></li>
            <li><a href="licenses/THIRD_PARTY_NOTICES">Licenses and third-party notices</a></li>
          </ul>
          HTML

      - name: Build Isabelle proof presentation
        run: |
          nix develop --command isabelle build \
            -o quick_and_dirty=false -o threads=4 -o parallel_proofs=1 \
            -D isabelle-hol-kernel \
            -P "$PWD/_site/isabelle" \
            Rhombus_HOL_Kernel

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
