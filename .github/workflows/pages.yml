name: Documentation

# `raco setup --pkgs rhombus-hol` writes the manual under
# rhombus-hol/rhombus/hol/doc/. Its pages link to the shared Scribble CSS and
# JS one directory up, so the whole doc/ tree is the site, and the redirect
# written at its root points at rhombus-hol/index.html.
#
# CI builds the documentation on every branch; this workflow exists to publish
# what main builds.

on:
  push:
    branches: [main]
  workflow_dispatch:

# What the deploy job needs to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and no cancelling: a half-finished deploy is worse
# than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: Bogdanp/setup-racket@v1.11
        with:
          version: current
          variant: CS

      # As in ci.yml: one install for all three, so the dependencies among
      # them resolve as links to this checkout rather than as catalog lookups.
      # Documentation is left to the next step, which is the point here.
      - name: Install the packages
        run: |
          raco pkg install --auto --batch --no-docs \
            rhombus-hol-kernel/ rhombus-hol-lib/ rhombus-hol/

      # `raco setup` reports a document it could not build and still exits 0,
      # so the log is what has to be read -- otherwise a broken manual gets
      # published as though it were fine.
      - name: Build the manual
        run: |
          set -o pipefail
          raco setup --pkgs rhombus-hol 2>&1 | tee setup.log
          if grep -q '^raco setup: error' setup.log; then
            echo "::error::raco setup reported errors"
            grep -A 3 '^raco setup: error' setup.log
            exit 1
          fi

      - name: Assemble the site
        run: |
          site=_site
          cp -R rhombus-hol/rhombus/hol/doc "$site"
          cat > "$site/index.html" <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Rhombus/HOL</title>
          <meta http-equiv="refresh" content="0; url=rhombus-hol/index.html">
          <p><a href="rhombus-hol/index.html">Rhombus/HOL documentation</a></p>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
