version = 1
SPDX-PackageName = "rhombus-hol"
SPDX-PackageSupplier = "Person: Masaya Taniguchi"
SPDX-PackageDownloadLocation = "https://github.com/tani/rhombus-hol"

# Default for repository-authored source, tests, documentation, build files,
# notices, and package metadata. Later entries override this classification for
# files containing adapted third-party expression.
[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 Masaya Taniguchi"
SPDX-License-Identifier = "0BSD"

# HOL Light fusion.ml-derived executable kernel definitions and theory
# extension rules, plus the generated Rhombus rendition of those definitions.
[[annotations]]
path = [
  "isabelle-hol-kernel/Rhombus_HOL_Kernel.thy",
  "isabelle-hol-kernel/Rhombus_HOL_Extension_Core.thy",
  "rhombus-hol-kernel/rhombus/hol/kernel_generated.rhm",
  "rhombus-hol-prover/rhombus/hol/conv.rhm",
  "rhombus-hol-prover/rhombus/hol/infinity.rhm",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Masaya Taniguchi",
  "1998 University of Cambridge",
  "1998-2007 John Harrison",
]
SPDX-License-Identifier = "0BSD AND BSD-2-Clause"

# drule.rhm adapts material from both bool.ml and drule.ml; the latter's
# complete source header additionally credits Michael Faerber.
[[annotations]]
path = "rhombus-hol-prover/rhombus/hol/drule.rhm"
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Masaya Taniguchi",
  "1998 University of Cambridge",
  "1998-2007 John Harrison",
  "2018 Michael Faerber",
]
SPDX-License-Identifier = "0BSD AND BSD-2-Clause"

# algebra.rhm's product section adapts pair.ml, whose complete source header
# additionally credits Marco Maggesi.
[[annotations]]
path = "rhombus-hol-prover/rhombus/hol/algebra.rhm"
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Masaya Taniguchi",
  "1998 University of Cambridge",
  "1998-2007 John Harrison",
  "2015 Marco Maggesi",
]
SPDX-License-Identifier = "0BSD AND BSD-2-Clause"

# The Rhombus code serializer adapts Isabelle's ML/Haskell/Scala serializers.
[[annotations]]
path = "isabelle-hol-kernel/Rhombus_Code_Target.ML"
precedence = "override"
SPDX-FileCopyrightText = [
  "2026 Masaya Taniguchi",
  "1986-2026 University of Cambridge, Technische Universitaet Muenchen, and contributors",
]
SPDX-FileContributor = "Florian Haftmann, TU Muenchen"
SPDX-License-Identifier = "0BSD AND BSD-3-Clause"

